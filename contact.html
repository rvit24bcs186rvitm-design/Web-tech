    </nav>

    <button id="themeBtn">☾</button>

</header>


<div class="page-title">

    <p>GET IN TOUCH</p>

    <h1>Contact Me</h1>

</div>


<main class="contact-container">


    <section class="contact-info">

        <h2>Let's Connect</h2>

        <p>
            Feel free to contact me for academic collaborations,
            projects or technology-related discussions.
        </p>


        <div class="contact-item">

            <span>✉</span>

            <div>

                <small>Email</small>

                <p>jyothsna@example.com</p>

            </div>

        </div>


        <div class="contact-item">

            <span>☎</span>

            <div>

                <small>Phone</small>

                <p>+91 6361782272</p>

            </div>

        </div>


        <div class="contact-item">

            <span>⌂</span>

            <div>

                <small>Location</small>

                <p>Bengaluru, India</p>

            </div>

        </div>

    </section>


    <section class="form-box">

        <form id="contactForm">

            <label>Name</label>

            <input type="text"
                   id="name"
                   placeholder="Enter your name">

            <label>Email</label>

            <input type="email"
                   id="email"
                   placeholder="Enter your email">

            <label>Subject</label>

            <input type="text"
                   id="subject"
                   placeholder="Enter subject">

            <label>Message</label>

            <textarea id="message"
                      rows="5"
                      placeholder="Write your message"></textarea>

            <button type="submit"
                    class="btn">
                Send Message
            </button>

            <p id="formMessage"></p>

        </form>

    </section>

</main>
